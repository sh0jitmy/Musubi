name: adhoc-8step-linkdown-recovery
description: "On-demand ad-hoc scenario with 10 SNMP requests verifying interface down and recovery via SNMP Inform-Request"
target_locks:
  - "${inputs.target}"
inputs:
  target:
    type: string
    default: "spine1"
    description: "Target network switch name"
steps:
  # Request 1: SNMP Get System Description
  - id: step1_get_sys_descr
    name: "Get System Description"
    target: "${inputs.target}"
    action: action.snmp_get
    params:
      oid: ".1.3.6.1.2.1.1.1.0"

  # Request 2: SNMP Get System Hostname
  - id: step2_get_sys_name
    name: "Get System Hostname"
    target: "${inputs.target}"
    action: action.snmp_get
    params:
      oid: ".1.3.6.1.2.1.1.5.0"

  # Request 3: SNMP Get Port 1 Initial Status (Admin and Oper)
  - id: step3_get_initial_if_status
    name: "Get Port 1 Initial Status"
    target: "${inputs.target}"
    action: action.snmp_get
    params:
      oids:
        - ".1.3.6.1.2.1.2.2.1.7.1"
        - ".1.3.6.1.2.1.2.2.1.8.1"

  # Request 4: SNMP Bulk-Get Interface Counters
  - id: step4_bulk_get_counters
    name: "Bulk-Get Interface Counters"
    target: "${inputs.target}"
    action: action.snmp_bulk_get
    params:
      oid: ".1.3.6.1.2.1.2.2.1"
      non_repeaters: 0
      max_repetitions: 5

  # Request 5: SNMP Bulk-Get Port 2 Admin & Oper Status
  - id: step5_bulk_get_port2
    name: "Bulk-Get Port 2 Status"
    target: "${inputs.target}"
    action: action.snmp_bulk_get
    params:
      oids:
        - ".1.3.6.1.2.1.2.2.1.7.2"
        - ".1.3.6.1.2.1.2.2.1.8.2"
      non_repeaters: 0
      max_repetitions: 2

  # Request 6: SNMP Set Port 1 Admin Status to DOWN (2)
  - id: step6_set_admin_down
    name: "Inject Fault: Set Port 1 Admin Status Down"
    target: "${inputs.target}"
    action: action.snmp_set
    params:
      oid: ".1.3.6.1.2.1.2.2.1.7.1"
      type: "int"
      value: 2

  # Wait for SNMP Inform-Request from Agent confirming OperStatus is DOWN (2)
  - id: step7_wait_oper_down_inform
    name: "Wait for Agent Inform-Request (OperStatus=down)"
    target: "${inputs.target}"
    wait:
      until: "raw[inputs.target]['.1.3.6.1.2.1.2.2.1.8.1'] == 2 || raw[inputs.target]['1.3.6.1.2.1.2.2.1.8.1'] == 2"
      timeout: "10s"
      interval: "50ms"

  # Request 7: SNMP Get Post-Inform Port 1 Status Verification
  - id: step8_verify_oper_down
    name: "Verify Port 1 OperStatus is Down"
    target: "${inputs.target}"
    action: action.snmp_get
    params:
      oid: ".1.3.6.1.2.1.2.2.1.8.1"

  # Request 8: SNMP Set Port 1 Admin Status to UP (1) (Recovery)
  - id: step9_set_admin_up
    name: "Recover: Set Port 1 Admin Status Up"
    target: "${inputs.target}"
    action: action.snmp_set
    params:
      oid: ".1.3.6.1.2.1.2.2.1.7.1"
      type: "int"
      value: 1

  # Wait for SNMP Inform-Request from Agent confirming OperStatus is UP (1)
  - id: step10_wait_oper_up_inform
    name: "Wait for Agent Inform-Request (OperStatus=up)"
    target: "${inputs.target}"
    wait:
      until: "raw[inputs.target]['.1.3.6.1.2.1.2.2.1.8.1'] == 1 || raw[inputs.target]['1.3.6.1.2.1.2.2.1.8.1'] == 1"
      timeout: "10s"
      interval: "50ms"

  # Request 9: SNMP Get Post-Recovery Port 1 Status Verification
  - id: step11_verify_oper_up
    name: "Verify Port 1 OperStatus is Up"
    target: "${inputs.target}"
    action: action.snmp_get
    params:
      oid: ".1.3.6.1.2.1.2.2.1.8.1"

  # Request 10: Final SNMP Bulk-Get Full Interface Table Verification
  - id: step12_final_bulk_get
    name: "Final Bulk-Get Full Interface Table"
    target: "${inputs.target}"
    action: action.snmp_bulk_get
    params:
      oid: ".1.3.6.1.2.1.2.2.1"
      non_repeaters: 0
      max_repetitions: 10
