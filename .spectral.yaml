extends: ["spectral:oas"]
rules:
  # 1. Pathは複数形 (Paths should represent resource collections in plural form, with exceptions for versions, parameters, and special keywords like login/logout/auth/token)
  paths-plural:
    description: "Paths should represent resource collections in plural form."
    message: "Path segment in {{property}} is not plural. Should end with 's' or be a parameter/special keyword."
    severity: warn
    given: $.paths[*]~
    then:
      function: pattern
      functionOptions:
        match: "^\\/(v[0-9]+|login|logout|auth|token|me|audit|system|drain|ping|history|raw|derived|logs|health|healthz|readyz|[a-z0-9-]+s|\\{[a-zA-Z0-9_-]+\\})(\\/(login|logout|auth|token|me|audit|system|drain|ping|history|raw|derived|logs|health|healthz|readyz|[a-z0-9-]+s|\\{[a-zA-Z0-9_-]+\\}))*$"

  # 2. Pathはkebab-case
  paths-kebab-case:
    description: "Path segments must be kebab-case."
    message: "{{property}} is not kebab-case."
    severity: error
    given: $.paths[*]~
    then:
      function: pattern
      functionOptions:
        match: "^(\\/([a-z0-9-]+|\\{[a-zA-Z0-9_-]+\\}))+$"

  # 3. operationId必須
  operation-operationId: error

  # 4. Tag必須
  operation-tags: error

  # 5. description必須
  operation-description: error
  info-description: error
  schema-description:
    description: "Schemas must have a description."
    severity: error
    given: $.components.schemas[*]
    then:
      field: description
      function: truthy

  # 6. examples必須
  schema-property-example:
    description: "Schema properties must have an example."
    severity: warn
    given: $.components.schemas[*].properties[*]
    then:
      function: schema
      functionOptions:
        schema:
          anyOf:
            - required: [example]
            - required: [examples]
            - properties:
                type:
                  enum: [object, array]

  # 7. Security定義必須
  security-defined:
    description: "Global security or components.securitySchemes must be defined."
    severity: error
    given: $
    then:
      function: schema
      functionOptions:
        schema:
          anyOf:
            - required: [security]
            - properties:
                components:
                  type: object
                  required: [securitySchemes]

  # 8. RFC7807エラー形式 (4xx, 5xx のレスポンスは RFC7807 (Problem Details) に従うこと)
  rfc7807-error-response:
    description: "Error responses (4xx, 5xx) must follow RFC7807 (Problem Details)."
    severity: error
    given: $.paths[*][*].responses[?(@property >= 400 && @property < 600)].content['application/json'].schema
    then:
      function: schema
      functionOptions:
        schema:
          type: object
          required: [properties]
          properties:
            properties:
              type: object
              required: [type, title, status, detail]

  # 11. APIバージョニング (パスが /v[0-9]+ で始まること)
  paths-versioning:
    description: "Paths must start with an API version (e.g. /v1)."
    severity: error
    given: $.paths[*]~
    then:
      function: pattern
      functionOptions:
        match: "^\\/v[0-9]+\\/"

  # 12. schema命名規則 (PascalCase)
  schema-names-pascal-case:
    description: "Schema names must be PascalCase."
    severity: error
    given: $.components.schemas[*]~
    then:
      function: pattern
      functionOptions:
        match: "^[A-Z][a-zA-Z0-9]+$"
